version: 2

sources:
  - name: raw
    description: >
      Tables loaded verbatim from the raw CSV exports by
      scripts/load_raw_to_duckdb.py, with no transformation. This is the
      extract/load boundary -- everything downstream of here is dbt's job.
    schema: raw
    tables:
      - name: item_snapshots
        description: >
          One row per item per monthly catalog export. Same item_id can
          appear in multiple snapshots with different price/cost/category --
          that history is exactly what dim_item's Type-2 snapshot is built
          from.
        columns:
          - name: item_id
            tests: [not_null]
          - name: export_date
            tests: [not_null]

      - name: toast_orders
        description: One row per completed (or voided) order.
        columns:
          - name: order_id
            tests: [not_null, unique]

      - name: toast_order_line_items
        description: One row per line item sold on an order.
        columns:
          - name: item_selection_id
            tests: [not_null, unique]
          - name: order_id
            tests: [not_null]
