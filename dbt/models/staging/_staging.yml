version: 2

models:
  - name: stg_item_snapshots
    description: Cleaned, typed catalog snapshot rows. One row per item per monthly export.
    columns:
      - name: item_snapshot_key
        tests: [not_null, unique]
      - name: item_id
        tests: [not_null]

  - name: stg_toast_orders
    description: Cleaned, typed order header rows.
    columns:
      - name: order_id
        tests: [not_null, unique]

  - name: stg_toast_order_line_items
    description: Cleaned, typed order line item rows.
    columns:
      - name: item_selection_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_toast_orders')
                field: order_id
